<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTM_v2.1 統合版 — 125,126,128 幾何学 & Alpha V1〜V4</title>
<style>

:root { --gtm-nav-h: 56px; }
#gtm-nav {
  position: sticky; top: 0; z-index: 9999;
  display: flex; gap: 0; align-items: stretch;
  height: var(--gtm-nav-h);
  background: #0b0f19; border-bottom: 1px solid #23283a;
  font-family: ui-sans-serif, system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  overflow-x: auto;
}
.gtm-tab {
  all: unset; cursor: pointer; box-sizing: border-box;
  display: flex; flex-direction: column; justify-content: center;
  gap: 2px; padding: 6px 18px; min-width: 150px; white-space: nowrap;
  color: #9aa3b2; border-right: 1px solid #1c2130;
  transition: background .15s, color .15s;
}
.gtm-tab:hover { background: #161b29; color: #e5e9f2; }
.gtm-tab.active { background: #1a2036; color: #fbbf24; box-shadow: inset 0 -2px 0 #fbbf24; }
.gtm-tab-tag { font-size: 11px; font-weight: 700; letter-spacing: .04em; opacity: .75; }
.gtm-tab-label { font-size: 13px; font-weight: 600; }
.gtm-page { min-height: calc(100vh - var(--gtm-nav-h)); }
@media (max-width: 640px) {
  .gtm-tab { min-width: 120px; padding: 6px 12px; }
  .gtm-tab-label { font-size: 12px; }
}

<script>

function gtmShowPage(n) {
  document.querySelectorAll('.gtm-page').forEach(function (el) {
    el.style.display = 'none';
    el.classList.remove('active');
  });
  document.querySelectorAll('.gtm-tab').forEach(function (el) {
    el.classList.remove('active');
  });
  var page = document.getElementById('page-' + n);
  if (page) { page.style.display = ''; page.classList.add('active'); }
  var tab = document.querySelector('.gtm-tab[data-target="page-' + n + '"]');
  if (tab) { tab.classList.add('active'); }
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
}
